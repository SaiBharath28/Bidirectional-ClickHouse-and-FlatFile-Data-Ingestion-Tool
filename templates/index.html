<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Ingestion Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Bidirectional Data Ingestion Tool</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>Source Configuration</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Select Source</label>
                        <select class="form-select" id="sourceType">
                            <option value="clickhouse">ClickHouse</option>
                            <option value="file">Flat File</option>
                        </select>
                    </div>
                </div>
                
                <!-- ClickHouse Source Configuration -->
                <div id="clickhouseSourceConfig">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label">Host</label>
                            <input type="text" class="form-control" id="chHost" value="localhost">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Port</label>
                            <input type="text" class="form-control" id="chPort" value="8123">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Database</label>
                            <input type="text" class="form-control" id="chDatabase" value="default">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">User</label>
                            <input type="text" class="form-control" id="chUser" value="default">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">JWT Token</label>
                            <input type="password" class="form-control" id="chJwtToken">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <button class="btn btn-primary" id="connectClickHouse">Connect</button>
                        </div>
                    </div>
                    <div class="row mb-3" id="chTablesSection" style="display: none;">
                        <div class="col-md-6">
                            <label class="form-label">Select Table</label>
                            <select class="form-select" id="chTables"></select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-secondary mt-4" id="loadColumns">Load Columns</button>
                        </div>
                    </div>
                </div>
                
                <!-- File Source Configuration -->
                <div id="fileSourceConfig" style="display: none;">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Select File</label>
                            <input type="file" class="form-control" id="sourceFile" accept=".csv,.txt">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Delimiter</label>
                            <input type="text" class="form-control" id="fileDelimiter" value=",">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-secondary mt-4" id="loadFileColumns">Load Columns</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Column Selection -->
        <div class="card mb-4" id="columnSelectionCard" style="display: none;">
            <div class="card-header">
                <h5>Column Selection</h5>
            </div>
            <div class="card-body">
                <div id="columnsContainer" class="mb-3"></div>
                <button class="btn btn-info" id="previewData">Preview Data</button>
            </div>
        </div>
        
        <!-- Target Configuration -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Target Configuration</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Select Target</label>
                        <select class="form-select" id="targetType">
                            <option value="file">Flat File</option>
                            <option value="clickhouse">ClickHouse</option>
                        </select>
                    </div>
                </div>
                
                <!-- ClickHouse Target Configuration -->
                <div id="clickhouseTargetConfig" style="display: none;">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label">Host</label>
                            <input type="text" class="form-control" id="targetChHost" value="localhost">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Port</label>
                            <input type="text" class="form-control" id="targetChPort" value="8123">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Database</label>
                            <input type="text" class="form-control" id="targetChDatabase" value="default">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">User</label>
                            <input type="text" class="form-control" id="targetChUser" value="default">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">JWT Token</label>
                            <input type="password" class="form-control" id="targetChJwtToken">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Table Name</label>
                            <input type="text" class="form-control" id="targetTable">
                        </div>
                        <div class="col-md-3">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" id="createNewTable">
                                <label class="form-check-label">Create new table</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- File Target Configuration -->
                <div id="fileTargetConfig">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Output Filename</label>
                            <input type="text" class="form-control" id="outputFilename" value="output.csv">
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <button class="btn btn-success" id="startIngestion">Start Ingestion</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Status and Results -->
        <div class="card">
            <div class="card-header">
                <h5>Status & Results</h5>
            </div>
            <div class="card-body">
                <div id="statusMessage" class="alert alert-info">Ready to start</div>
                <div id="resultMessage" class="alert" style="display: none;"></div>
                
                <!-- Preview Table -->
                <div id="previewTableContainer" style="display: none;">
                    <h6>Data Preview (First 100 rows)</h6>
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped" id="previewTable">
                            <thead></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Download Link -->
                <div id="downloadContainer" style="display: none;">
                    <a href="#" class="btn btn-primary" id="downloadLink">Download File</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
